[project]
name = "left-tail-volatility"
version = "0.1.0"
description = "Can GARCH and machine learning warn us about downside risk?"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "arch>=7,<9",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "yfinance>=0.2.54,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ipykernel>=6,<8",
    "nbformat>=5,<6",
    "nbconvert>=7,<8",
    "jupyterlab>=4,<5",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/left_tail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
